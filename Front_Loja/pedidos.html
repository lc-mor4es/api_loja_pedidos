<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pedidos.css">
    <title>Pedidos</title>
</head>
<body>

    <div class="container">
        <h1>Consulta de Pedidos</h1>
        <ul id="pedidos-lista"></ul>
    </div>

    <div class="container2">
        <h1>Cadastro de Pedidos</h1>

        <h2>Descrição</h2>
        <input type="text" id="descricaopedido" placeholder="Descrição">

        <h2>Valor</h2>
        <input type="number" id="valorpedido" placeholder="Valor">

        <h2>Cliente</h2>
        <select id="clientepedido">
            <option value="">Selecione um cliente</option>
        </select>

        <br><br>

        <div class="form-actions">
            <a href="home.html" class="btn-voltar">Clientes</a>
            <button class="btn-cadastrar" onclick="cadastrarpedido()">Cadastrar</button>
            <button class="btn-atualizar" onclick="atualizarpedido()">Atualizar</button>
        </div>
    </div>

    <script src="pedidos.js"></script>
</body>
</html>
